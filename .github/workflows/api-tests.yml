name: ModelTrace API tests

on:
  push:
    paths: ['**.py', 'requirements.txt', 'data/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['**.py', 'requirements.txt', 'data/**', '.github/workflows/api-tests.yml']

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
